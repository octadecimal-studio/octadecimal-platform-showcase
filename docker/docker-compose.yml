# Octadecimal Studio - Docker Compose (Produkcja)
# Autor: Octadecimal Studio
# Wersja: 1.0.0

services:
  # Aplikacja PHP-FPM (Laravel)
  app:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: octadecimal_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ../src:/var/www/html
      - ./php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - octadecimal
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  # Serwer Nginx
  # UWAGA: Port 443 wymaga konfiguracji SSL (certyfikaty).
  # Dla produkcji z SSL, użyj reverse proxy (Traefik/Caddy) lub skonfiguruj certyfikaty.
  nginx:
    image: nginx:alpine
    container_name: octadecimal_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
      # Port 443 zakomentowany - wymaga konfiguracji SSL
      # - "${APP_SSL_PORT:-443}:443"
    volumes:
      - ../src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      # Dla SSL odkomentuj i dodaj certyfikaty:
      # - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - octadecimal
    depends_on:
      - app

  # Baza danych MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: octadecimal_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-octadecimal}
      MYSQL_USER: ${DB_USERNAME:-octadecimal}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/custom.cnf
    networks:
      - octadecimal
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Cache Redis
  redis:
    image: redis:alpine
    container_name: octadecimal_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - octadecimal
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # Laravel Horizon (Queue Worker)
  horizon:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: octadecimal_horizon
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan horizon
    volumes:
      - ../src:/var/www/html
      - ./php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - octadecimal
    depends_on:
      - app
      - redis
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  # Laravel Scheduler (Cron)
  scheduler:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: octadecimal_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ../src:/var/www/html
      - ./php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - octadecimal
    depends_on:
      - app
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379

networks:
  octadecimal:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
