# Octadecimal Studio - Konfiguracja Nginx
# Zoptymalizowana dla Laravel 11 i Filament 3

server {
    listen 80;
    listen [::]:80;
    
    server_name localhost;
    
    root /var/www/html/public;
    index index.php index.html;
    
    charset utf-8;
    
    # Logowanie
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    
    # Maksymalny rozmiar uploadu
    client_max_body_size 100M;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Główna lokalizacja
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # Obsługa PHP
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 120;
    }
    
    # Blokuj dostęp do plików .ht*
    location ~ /\.ht {
        deny all;
    }
    
    # Blokuj dostęp do wrażliwych plików
    location ~ /\.(env|git|svn) {
        deny all;
    }
    
    # Optymalizacja statycznych zasobów
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Favicon i robots.txt
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
    
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }
    
    # Health check
    location = /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
