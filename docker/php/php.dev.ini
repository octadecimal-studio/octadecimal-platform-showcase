; Octadecimal Studio - Konfiguracja PHP (Development)
; Używana przez docker-compose.dev.yml

[PHP]
; Limity pamięci i czasu wykonania
memory_limit = 512M
max_execution_time = 120
max_input_time = 60
max_input_vars = 5000

; Upload plików
upload_max_filesize = 100M
post_max_size = 100M
max_file_uploads = 50

; Obsługa błędów (development - pokazuj błędy)
display_errors = On
display_startup_errors = On
log_errors = On
error_reporting = E_ALL
error_log = /var/log/php/error.log

; Strefa czasowa
date.timezone = Europe/Warsaw

; Sesje (development - HTTP dozwolone)
session.cookie_httponly = 1
session.cookie_secure = 0
session.use_strict_mode = 1
session.cookie_samesite = Lax

; Bezpieczeństwo
expose_php = On
allow_url_fopen = On
allow_url_include = Off

[opcache]
; OPcache (z walidacją timestamps dla dev)
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.save_comments = 1

[xdebug]
; Xdebug (włączony w development)
xdebug.mode = debug,develop
xdebug.start_with_request = yes
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = PHPSTORM
xdebug.log = /var/log/php/xdebug.log
