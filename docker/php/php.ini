; Octadecimal Studio - Konfiguracja PHP
; Optymalizacja dla Laravel 11 i Filament 3

[PHP]
; Limity pamięci i czasu wykonania
memory_limit = 512M
max_execution_time = 120
max_input_time = 60
max_input_vars = 5000

; Upload plików
upload_max_filesize = 100M
post_max_size = 100M
max_file_uploads = 50

; Obsługa błędów (produkcja)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
error_log = /var/log/php/error.log

; Strefa czasowa
date.timezone = Europe/Warsaw

; Sesje
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1

; Bezpieczeństwo
expose_php = Off
allow_url_fopen = On
allow_url_include = Off

[opcache]
; OPcache - znaczące przyspieszenie
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.jit = 1255
opcache.jit_buffer_size = 128M

[xdebug]
; Xdebug (wyłączony domyślnie w produkcji)
xdebug.mode = off
xdebug.start_with_request = no
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = PHPSTORM
